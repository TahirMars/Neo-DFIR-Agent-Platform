[project]
name = "neo-backend"
version = "0.1.0"
description = "Neo 数字取证与事件响应多智能体 Agent 平台后端"
requires-python = ">=3.11"
dependencies = [
    # Web Framework
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "python-multipart>=0.0.6",
    # Authentication
    "bcrypt>=4.0.0",
    "PyJWT>=2.8.0",
    # Database
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    # Configuration
    "pydantic-settings>=2.0.0",
    # LLM (OpenAI-compatible)
    "openai>=1.0.0",
    # LangGraph Multi-Agent
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    # Report
    "markdown>=3.5.0",
    "xhtml2pdf>=0.2.11",
    # Utilities
    "python-dotenv>=1.0.0",
    "aiofiles>=23.2.0",
    # Skills (SKILL.md YAML frontmatter)
    "pyyaml>=6.0.0",
    # 并发安全：案件记忆读改写互斥（多 worker / 并行 tool call）
    "filelock>=3.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "anyio>=4.0.0",
    "ruff>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
target-version = "py311"
line-length = 120
